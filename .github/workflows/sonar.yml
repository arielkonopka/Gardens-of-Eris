name: SonarCloud

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

concurrency:
  group: sonar-${{ github.ref }}
  cancel-in-progress: true

jobs:
  sonar:
    name: SonarCloud analysis
    runs-on: ubuntu-24.04
    env:
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
      # SonarCloud by default; set the SONAR_HOST_URL variable to scan against another server
      SONAR_HOST_URL: ${{ vars.SONAR_HOST_URL || secrets.SONAR_HOST_URL || 'https://sonarcloud.io' }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0  # Sonar needs the full history for blame and new-code detection

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            cmake ninja-build libgtest-dev liballegro5-dev liballegro-ttf5-dev liballegro-image5-dev rapidjson-dev \
            libopenal-dev libsndfile1-dev gcovr

      - name: Build with coverage
        run: |
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Debug \
            -DENABLE_SONARQUBE=ON -DCMAKE_EXPORT_COMPILE_COMMANDS=ON
          cmake --build build

      - name: Run unit tests
        run: ctest --test-dir build --output-on-failure --timeout 900

      - name: Coverage report
        run: |
          mkdir -p CoverageReports
          gcovr -r . --object-directory build -e unitTests --sonarqube -o CoverageReports/coverageReport.XML

      # A missing token, or a token the server refuses, is a settings problem and not
      # a code problem, so it shows as a warning instead of failing the check.
      - name: Check Sonar server and token
        id: server
        run: |
          if [ -z "$SONAR_TOKEN" ]; then
            echo "::warning::Set the SONAR_TOKEN secret to run the Sonar scan; it was skipped."
            echo "ready=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          reply=$(curl -s -u "$SONAR_TOKEN:" "${SONAR_HOST_URL%/}/api/authentication/validate" || true)
          if echo "$reply" | grep -q '"valid":true'; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::The Sonar server at $SONAR_HOST_URL did not accept SONAR_TOKEN (or could not be reached), so the scan was skipped. Reply: $reply"
            echo "ready=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Sonar scan
        if: steps.server.outputs.ready == 'true'
        uses: SonarSource/sonarqube-scan-action@v5
