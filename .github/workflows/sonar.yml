name: SonarCloud

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

concurrency:
  group: sonar-${{ github.ref }}
  cancel-in-progress: true

jobs:
  sonar:
    name: SonarCloud analysis
    runs-on: ubuntu-24.04
    env:
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0  # Sonar needs the full history for blame and new-code detection

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            cmake ninja-build libgtest-dev liballegro5-dev liballegro-ttf5-dev liballegro-image5-dev rapidjson-dev \
            libopenal-dev libsndfile1-dev gcovr

      - name: Build with coverage
        run: |
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Debug \
            -DENABLE_SONARQUBE=ON -DCMAKE_EXPORT_COMPILE_COMMANDS=ON
          cmake --build build

      - name: Run unit tests
        run: ctest --test-dir build --output-on-failure --timeout 900

      - name: Coverage report
        run: |
          mkdir -p CoverageReports
          gcovr -r . --object-directory build -e unitTests --sonarqube -o CoverageReports/coverageReport.XML

      # An expired or revoked token is refused before any analysis runs. That is a settings
      # problem, not a code problem, so it shows as a warning instead of failing the check.
      - name: Check SonarCloud token
        id: token
        if: env.SONAR_TOKEN != ''
        run: |
          code=$(curl -s -o /dev/null -w '%{http_code}' -H "Authorization: Bearer $SONAR_TOKEN" \
            "https://api.sonarcloud.io/analysis/jres?os=linux&arch=x86_64")
          if [ "$code" = "401" ] || [ "$code" = "403" ]; then
            echo "::warning::SonarCloud refused SONAR_TOKEN (HTTP $code), so the scan was skipped. Replace the SONAR_TOKEN secret with a new token from sonarcloud.io."
            echo "valid=false" >> "$GITHUB_OUTPUT"
          else
            echo "valid=true" >> "$GITHUB_OUTPUT"
          fi

      - name: SonarCloud scan
        if: env.SONAR_TOKEN != '' && steps.token.outputs.valid == 'true'
        uses: SonarSource/sonarqube-scan-action@v5
        env:
          SONAR_HOST_URL: https://sonarcloud.io

      - name: Missing SonarCloud token
        if: env.SONAR_TOKEN == ''
        run: echo "::warning::SONAR_TOKEN secret is not set, so the SonarCloud scan was skipped."
