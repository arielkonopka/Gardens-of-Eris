name: CI

on:
  push:
    branches: [ "main" ]
    tags: [ "v*" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  linux:
    name: Linux build and unit tests
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            cmake ninja-build libgtest-dev liballegro5-dev liballegro-ttf5-dev liballegro-image5-dev rapidjson-dev \
            libopenal-dev libsndfile1-dev

      - name: Configure
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build

      - name: Run unit tests
        run: ctest --test-dir build --output-on-failure --timeout 600

      - name: Package
        run: |
          mkdir -p dist/GardensOfEris
          cp build/GardenOfEris dist/GardensOfEris/
          cp -r GoEoOL/data dist/GardensOfEris/
          tar -C dist -czf GardensOfEris-linux-x86_64.tar.gz GardensOfEris

      - uses: actions/upload-artifact@v4
        with:
          name: GardensOfEris-linux-x86_64
          path: GardensOfEris-linux-x86_64.tar.gz

  windows:
    name: Windows build and unit tests
    runs-on: windows-latest
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - uses: actions/checkout@v4

      - uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          install: >-
            mingw-w64-ucrt-x86_64-gcc
            mingw-w64-ucrt-x86_64-cmake
            mingw-w64-ucrt-x86_64-ninja
            mingw-w64-ucrt-x86_64-gtest
            mingw-w64-ucrt-x86_64-allegro
            mingw-w64-ucrt-x86_64-rapidjson
            mingw-w64-ucrt-x86_64-openal
            mingw-w64-ucrt-x86_64-libsndfile

      - name: Configure
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build

      - name: Run unit tests
        run: ctest --test-dir build --output-on-failure --timeout 600

      - name: Package
        run: |
          mkdir -p dist/GardensOfEris
          cp build/GardenOfEris.exe dist/GardensOfEris/
          cp -r GoEoOL/data dist/GardensOfEris/
          # Ship the MinGW runtime and library DLLs next to the game
          ldd build/GardenOfEris.exe | awk '/\/ucrt64\// {print $3}' | sort -u | xargs -r -I{} cp {} dist/GardensOfEris/

      - uses: actions/upload-artifact@v4
        with:
          name: GardensOfEris-windows-x86_64
          path: dist/GardensOfEris

  release:
    name: Publish release
    # a pushed version tag (v1.2.3) turns the two builds into a GitHub release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [ linux, windows ]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Pack the Windows build
        run: |
          cd artifacts
          mv GardensOfEris-windows-x86_64 GardensOfEris
          zip -qr ../GardensOfEris-windows-x86_64.zip GardensOfEris

      - uses: softprops/action-gh-release@v2
        with:
          name: Gardens of Eris ${{ github.ref_name }}
          generate_release_notes: true
          files: |
            artifacts/GardensOfEris-linux-x86_64/GardensOfEris-linux-x86_64.tar.gz
            GardensOfEris-windows-x86_64.zip
